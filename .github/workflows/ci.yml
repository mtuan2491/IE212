name: Bootstrap checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sh scripts/ci/check_private_files.sh
      - run: bash scripts/ci/run_tests.sh
